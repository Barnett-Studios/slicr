name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # release: build + push the image
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # prerelease: same (image only)
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing via GitHub OIDC
    steps:
      # Actions pinned to commit SHAs (never @vN — tags are mutable), matching ci.yml.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # Pure-Python COPY-only build over a multi-arch base — no QEMU needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # CONTRACT.md states that VERSION, the git tag and the published image tag are the same
      # number "by construction". Nothing constructed it: neither workflow read VERSION, so a
      # tag cut over a tree whose VERSION says something else published an image whose in-tree
      # version disagreed with the tag serving it — and with `latest`. No step failed, no
      # output mentioned it (#27). Measured when this was written: VERSION 0.3.0, newest tag
      # v0.2.0, newest release v0.1.3. Three numbers for one thing.
      #
      # This compares against `steps.meta.outputs.version` — the value metadata-action
      # resolved and the SAME one the push below tags with — not a hand-stripped
      # `github.ref_name`. dotclaude#63 is what the other way looks like: a guard that
      # stripped the `v` itself compared matching numbers while the push used the raw tag, so
      # the guard and the push disagreed about what "the version" was and both passed.
      #
      # It runs BEFORE the build so a mismatch costs a failed workflow, not a published image
      # that has to be un-published.
      - name: VERSION must agree with the reference being published
        env:
          RESOLVED: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          test -r VERSION || { echo "::error::VERSION is missing or unreadable"; exit 1; }
          file="$(tr -d '[:space:]' < VERSION)"
          test -n "$file" || { echo "::error::VERSION is empty"; exit 1; }
          test -n "$RESOLVED" || { echo "::error::metadata-action resolved no version"; exit 1; }
          if [ "$file" != "$RESOLVED" ]; then
            echo "::error::VERSION says '$file' but this release publishes '$RESOLVED'."
            echo "::error::CONTRACT.md states these agree by construction. Bump VERSION, or re-tag."
            exit 1
          fi
          echo "VERSION $file agrees with the reference being published ($RESOLVED)"

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          # Pin to the latest cosign 2.x. cosign 3.x dropped the detached
          # `cosign-linux-amd64.sig` asset that this installer verifies against, so a
          # 3.x pin 404s the sig download (exit 22). 2.6.4 still ships the .sig.
          cosign-release: 'v2.6.4'
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
